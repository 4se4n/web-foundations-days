<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    #status {
      font-weight: bold;
      margin-bottom: 1rem;
    }
    #users-list {
      list-style: none;
      padding: 0;
    }
    #users-list li {
      background: #f4f4f9;
      margin-bottom: 0.5rem;
      padding: 0.75rem;
      border-radius: 4px;
      border-left: 4px solid #007bff;
    }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users">Load Users</button>
    <div>
      <label for="filter-input">Filter by name:</label>
      <input type="text" id="filter-input" placeholder="Type a name...">
    </div>
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>
</body>
</html>
